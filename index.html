<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SOKAR — اطلب عبر واتساب</title>
    <meta
      name="description"
      content="كتالوج منتجاتنا — تصفح واطلب مباشرة عبر واتساب"
    />
    <meta name="theme-color" content="#442d1f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23442d1f'/%3E%3Ctext x='32' y='47' font-size='40' font-weight='700' text-anchor='middle' fill='%23ffb020' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f2ec;
        --card: #fff;
        --ink: #2a1c12;
        --muted: #7a6a5c;
        --brand: #8a4b12;
        --onb: #fff;
        --wa: #1eaa57;
        --wa2: #169248;
        --line: #e8dfd2;
        --r: 20px;
        --sh:
          0 1px 2px rgba(42, 28, 18, 0.05),
          0 14px 30px -18px rgba(42, 28, 18, 0.28);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #150f0a;
          --card: #211912;
          --ink: #f4ece2;
          --muted: #a8978a;
          --line: #33281e;
          --brand: #f0a93e;
          --onb: #1a1008;
          --sh:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 30px -18px rgba(0, 0, 0, 0.6);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: Cairo, "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      .hidden {
        display: none !important;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* الهيرو */
      .hero {
        position: relative;
        overflow: hidden;
        color: #fff;
        text-align: center;
        min-height: clamp(380px, 58vw, 540px);
        display: flex;
        align-items: flex-end;
        padding: 28px 16px 74px;
        background:
          radial-gradient(120% 140% at 80% -10%, #e9a23b 0, transparent 55%),
          linear-gradient(160deg, #6b4423, #2a1a10);
      }
      .hero-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: 34% 30%;
        opacity: 0;
        transition: opacity 0.9s ease;
      }
      .hero-bg.on {
        opacity: 1;
      }
      .hero-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(28, 16, 8, 0.12) 0,
          rgba(28, 16, 8, 0.28) 38%,
          rgba(22, 12, 5, 0.92) 100%
        );
      }
      .hero-in {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .hero-logo {
        width: min(290px, 66vw);
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
        animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .hero-logo svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .hero-logo img {
        display: block;
        margin: 0 auto;
        width: auto;
        height: auto;
        max-height: 100px;
        max-width: 100%;
        object-fit: contain;
      }
      .hero p {
        font-size: clamp(15px, 3.8vw, 19px);
        font-weight: 600;
        color: #f6e7d2;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        animation: fadeUp 0.9s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .hero-cta {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.34);
        backdrop-filter: blur(8px);
        color: #fff;
        text-decoration: none;
        padding: 8px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        transition: background-color 0.25s ease;
        animation: fadeUp 0.9s 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .hero-cta:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      .hero-cta svg,
      .order-btn svg,
      .fab svg,
      .m-order svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      /* شريط البحث والفئات */
      .bar {
        position: sticky;
        top: 0;
        z-index: 50;
        margin-top: -30px;
        padding: 0 12px;
      }
      .bar-in {
        max-width: 1080px;
        margin: 0 auto;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--sh);
        padding: 10px;
      }
      .search {
        position: relative;
      }
      .search svg {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        inset-inline-start: 14px;
        width: 17px;
        height: 17px;
        color: var(--muted);
        pointer-events: none;
      }
      #q {
        width: 100%;
        padding: 11px 16px;
        padding-inline-start: 40px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg);
        font-size: 15px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #q:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent);
      }
      #q::placeholder {
        color: var(--muted);
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 2px 2px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex-shrink: 0;
        padding: 6px 15px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 0.25s,
          background-color 0.25s,
          border-color 0.25s;
      }
      .chip:hover {
        color: var(--brand);
        border-color: var(--brand);
      }
      .chip.on {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--onb);
      }
      .chip small {
        opacity: 0.7;
        margin-inline-start: 5px;
        font-weight: 600;
      }

      #banners {
        max-width: 1080px;
        margin: 0 auto;
        width: 100%;
        padding: 14px 16px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .banner {
        position: relative;
        padding: 10px 38px 10px 14px;
        border-radius: 14px;
        font-size: 13.5px;
        border: 1px solid;
      }
      .b-demo {
        background: #fff8e6;
        border-color: #f2dfa5;
        color: #8a6116;
      }
      .b-error {
        background: #fdecec;
        border-color: #f5c6c6;
        color: #9b2c2c;
      }
      .b-warn {
        background: #fff3e2;
        border-color: #ffd9a8;
        color: #9a5b13;
      }
      .banner button {
        position: absolute;
        top: 6px;
        inset-inline-end: 10px;
        background: none;
        border: 0;
        font-size: 20px;
        cursor: pointer;
        opacity: 0.6;
      }

      /* الشبكة */
      main {
        flex: 1;
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 18px 16px 110px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
          gap: 18px;
        }
      }
      .card {
        --sh2:
          0 2px 4px rgba(15, 23, 42, 0.05),
          0 22px 38px -18px rgba(15, 23, 42, 0.38);
        background: var(--card);
        border-radius: var(--r);
        overflow: hidden;
        box-shadow: var(--sh);
        display: flex;
        flex-direction: column;
        cursor: pointer;
        border: 1px solid var(--line);
        transition:
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }
      @media (hover: hover) {
        .card:hover {
          transform: translateY(-3px);
          box-shadow: var(--sh2);
        }
        .card:hover .thumb img {
          transform: scale(1.035);
        }
      }
      .card:active {
        transform: scale(0.985);
        transition-duration: 0.15s;
      }
      .thumb {
        position: relative;
        aspect-ratio: 1/1;
        overflow: hidden;
      }
      .ph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.9);
      }
      .thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition:
          opacity 0.5s,
          transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .thumb img.ok {
        opacity: 1;
      }
      .tag {
        position: absolute;
        top: 9px;
        inset-inline-start: 9px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.92);
        color: #334;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 999px;
      }
      .sold {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
      }
      .body {
        padding: 12px 13px 13px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .name {
        font-weight: 700;
        font-size: 15px;
        line-height: 1.4;
      }
      .desc {
        font-size: 12.5px;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .price {
        font-weight: 900;
        font-size: 18px;
        color: var(--brand);
        margin-top: 2px;
      }
      .price span {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .order-btn,
      .m-order {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: var(--wa);
        color: #fff;
        border: 0;
        border-radius: 13px;
        padding: 10px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background-color 0.25s ease,
          transform 0.2s ease;
      }
      .order-btn:hover,
      .m-order:hover {
        background: var(--wa2);
      }
      .order-btn:active,
      .m-order:active {
        transform: scale(0.96);
      }
      .order-btn.off,
      .m-order.off {
        background: var(--line);
        color: var(--muted);
        cursor: not-allowed;
      }
      .card.in {
        animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        animation-delay: calc(var(--i) * 35ms);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
      }

      /* هيكل التحميل */
      .sk {
        border-radius: var(--r);
        background: var(--card);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .sk i {
        display: block;
        background: linear-gradient(
          90deg,
          var(--line) 25%,
          color-mix(in srgb, var(--line) 40%, var(--card)) 50%,
          var(--line) 75%
        );
        background-size: 200% 100%;
        animation: sh 1.3s linear infinite;
      }
      .sk i:first-child {
        aspect-ratio: 1/1;
      }
      .sk i + i {
        height: 14px;
        margin: 12px;
        border-radius: 8px;
      }
      .sk i + i + i {
        width: 50%;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .empty button {
        padding: 8px 22px;
        border-radius: 999px;
        border: 1px solid var(--brand);
        background: none;
        color: var(--brand);
        font-weight: 700;
        cursor: pointer;
      }

      /* نافذة التفاصيل */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(8, 12, 30, 0.6);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .modal.open {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        max-height: 92vh;
        overflow: auto;
        border-radius: 26px 26px 0 0;
        transform: translateY(40px);
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .modal.open .sheet {
        transform: none;
      }
      @media (min-width: 640px) {
        .modal {
          align-items: center;
        }
        .sheet {
          border-radius: 26px;
        }
      }
      .m-img {
        position: relative;
        aspect-ratio: 1/1;
        max-height: 46vh;
        width: 100%;
      }
      .m-img .ph {
        font-size: 80px;
      }
      .m-img img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .m-x {
        position: absolute;
        top: 12px;
        inset-inline-end: 12px;
        z-index: 4;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 0;
        background: rgba(15, 23, 42, 0.6);
        color: #fff;
        font-size: 22px;
        cursor: pointer;
      }
      .m-body {
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .m-body h2 {
        font-size: 21px;
        line-height: 1.4;
      }
      .m-cat {
        font-size: 12px;
        font-weight: 700;
        color: var(--brand);
      }
      .m-desc {
        color: var(--muted);
        font-size: 14.5px;
        white-space: pre-line;
      }
      .m-price {
        font-size: 26px;
        font-weight: 900;
        color: var(--brand);
      }
      .m-price span {
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
      }
      .m-order {
        margin-top: 10px;
        padding: 14px;
        font-size: 16px;
        border-radius: 16px;
      }

      footer {
        border-top: 1px solid var(--line);
        background: var(--card);
        padding: 22px 16px 100px;
        text-align: center;
      }
      footer b {
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      footer p {
        font-size: 12px;
        color: var(--muted);
      }
      .fab {
        position: fixed;
        bottom: calc(18px + env(safe-area-inset-bottom));
        left: 18px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--wa);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 70;
        box-shadow: 0 12px 30px rgba(30, 170, 87, 0.45);
        transition: transform 0.2s;
      }
      .fab:hover {
        transform: scale(1.08);
      }
      .fab svg {
        width: 30px;
        height: 30px;
      }
      .fab::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--wa);
        animation: ping 2.4s ease-out infinite;
      }
      .fab.off {
        background: #94a0bd;
        box-shadow: none;
      }
      .fab.off::after {
        display: none;
      }
      @keyframes ping {
        from {
          transform: scale(1);
          opacity: 0.7;
        }
        to {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="wa" viewBox="0 0 448 512">
        <path
          d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.700-30.900c32.400 17.700 68.900 27 106.100 27h.1c122.300 0 224.100-99.600 224.100-222 0-59.300-25.200-115-67.100-157zm-157 341.600c-33.200 0-65.700-8.900-94-25.700l-6.700-4-69.800 18.300L72 359.200l-4.400-7c-18.500-29.400-28.200-63.300-28.200-98.200 0-101.700 82.800-184.500 184.600-184.500 49.300 0 95.600 19.200 130.400 54.100 34.800 34.900 56.200 81.200 56.100 130.500 0 101.800-84.900 184.600-186.600 184.600zm101.200-138.200c-5.500-2.800-32.800-16.200-37.900-18-5.100-1.900-8.800-2.800-12.500 2.800-3.700 5.600-14.300 18-17.600 21.800-3.200 3.700-6.500 4.200-12 1.400-32.600-16.300-54-29.100-75.500-66-5.700-9.800 5.700-9.100 16.300-30.300 1.800-3.700.9-6.900-.5-9.700-1.400-2.800-12.500-30.100-17.100-41.200-4.500-10.800-9.100-9.300-12.500-9.500-3.200-.2-6.900-.2-10.600-.2-3.700 0-9.700 1.400-14.800 6.900-5.100 5.600-19.400 19-19.400 46.300 0 27.300 19.900 53.700 22.600 57.400 2.800 3.700 39.100 59.700 94.800 83.800 35.200 15.200 49 16.500 66.600 13.900 10.700-1.600 32.800-13.400 37.400-26.400 4.600-13 4.600-24.100 3.200-26.400-1.300-2.500-5-3.900-10.500-6.600z"
        />
      </symbol>
    </svg>

    <header class="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-in">
        <div class="hero-logo" id="heroLogo"></div>
        <h1 class="sr" id="brandName">SOKAR</h1>
        <p id="brandTagline">اشتري بثقة</p>
        <a class="hero-cta" id="heroCta" href="#" target="_blank" rel="noopener"
          ><svg><use href="#wa" /></svg>تواصل معنا على واتساب</a
        >
      </div>
    </header>

    <div class="bar">
      <div class="bar-in">
        <div class="search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="16.500" y1="16.500" x2="21" y2="21" />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="ابحث عن منتج..."
            autocomplete="off"
          />
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div id="banners"></div>

    <main>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="empty">
        <p>مفيش منتجات مطابقة لبحثك.</p>
        <button id="reset" type="button">امسح البحث</button>
      </div>
    </main>

    <footer>
      <p><b id="footerName">SOKAR</b></p>
      <p>العرض والطلب عن طريق واتساب — من غير دفع إلكتروني</p>
    </footer>

    <a
      id="fab"
      class="fab off"
      href="#"
      target="_blank"
      rel="noopener"
      aria-label="تواصل واتساب"
      ><svg><use href="#wa" /></svg
    ></a>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <script>
      "use strict";
      /* ═══ الإعدادات ═══ */
      const CONFIG = {
        SHEET_ID:
          "https://docs.google.com/spreadsheets/d/1z9gtqLrQ3QW1z0yPKbBuk0_WnlJQlB4oRjGhFs5c3qo/edit?usp=sharing",
        WHATSAPP_NUMBER: "+201124616674",
        SHOP_NAME: "SOKAR",
        SHOP_TAGLINE: "اشتري بثقة",
        CURRENCY: "ج.م",
        ORDER_MESSAGE: "مرحباً، حابب أطلب: {المنتج} — {السعر} {العملة}",
        /* صورة الغلاف واللوجو: ارفعهم جنب index.html بنفس الأسماء دي (أو غيّر الاسم هنا) */
        COVER_IMAGE: "cover.jpg",
        LOGO_IMAGE:
          "" /* اختياري: لوجو بديل (الافتراضي هو لوجو SOKAR المدمج في الصفحة) */,
        TAB_PRODUCTS: "منتجات",
        TAB_SETTINGS: "إعدادات",
        DEMO_PRODUCTS: [
          {
            name: "تيشيرت قطن أوفر سايز",
            price: 350,
            desc: "قطن 100% بيج وأسود، مقاسات من M لـ XXL",
            cat: "ملابس",
            image: "",
            available: true,
          },
          {
            name: "هودي شتوي بقلنسوة",
            price: 550,
            desc: "قطن مبطن دافي بجيوب أمامية وسحاب معدني",
            cat: "ملابس",
            image: "",
            available: true,
          },
          {
            name: "ساعة يد بسوار جلد",
            price: 1200,
            desc: "تصميم كلاسيك بجلد طبيعي ومقاومة للمياه",
            cat: "إكسسوارات",
            image: "",
            available: true,
          },
          {
            name: "سوار جلد مضفر",
            price: 180,
            desc: "صناعة يدوية بخيوط جلد متينة",
            cat: "إكسسوارات",
            image: "",
            available: false,
          },
          {
            name: "عطر أورا رجالي 100 مل",
            price: 750,
            desc: "ثبات عالي ورائحة تدوم طول اليوم",
            cat: "عطور",
            image: "",
            available: true,
          },
          {
            name: "شنطة ظهر عملية",
            price: 480,
            desc: "مساحة واسعة وجيب مبطن للابتوب 15 بوصة",
            cat: "شنط",
            image: "",
            available: true,
          },
        ],
      };

      let PRODUCTS = [],
        SETTINGS = {},
        WA = "",
        activeCat = "الكل",
        query = "";
      const $ = (id) => document.getElementById(id);
      const WORDMARK =
        '<svg viewBox="480 900 1040 200" fill="#fff" role="img" aria-label="SOKAR"><path  d="M955.45,1000l113.33,91.34-158.93.66V908.05l160.64.49Zm36-63.68-54.78-1.17.54,44.3ZM991.07,1064,937,1020.32l-.21,44.54Z"/><path  d="M1330.89,1091.57l-201.84.38,101.69-183.62Zm-44.3-25.23-56-102.86L1173.79,1067Z"/><polygon  points="1486.83 935.22 1416.45 935.58 1416.51 1091.22 1389.46 1091.94 1389.47 908.1 1513.8 908.23 1514.09 960.53 1486.98 961.11 1486.83 935.22"/><polygon  points="515.75 1091.94 500.84 1069.84 563.92 1035.43 485.91 959.65 579.48 908.33 593.13 931.25 530.56 965.34 608.98 1041.2 515.75 1091.94"/><path  d="M851.27,1000.09a91.86,91.86,0,1,1-91.86-91.86A91.86,91.86,0,0,1,851.27,1000.09Zm-27.26,0a64.59,64.59,0,1,0-64.59,64.59A64.59,64.59,0,0,0,824,1000.09Z"/><circle  cx="759.41" cy="1000.03" r="18.56"/></svg>';

      /* ═══ أدوات مساعدة ═══ */
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const normDigits = (s) =>
        String(s == null ? "" : s)
          .replace(/[\u0660-\u0669]/g, (d) => d.charCodeAt(0) - 0x660)
          .replace(/[\u06F0-\u06F9]/g, (d) => d.charCodeAt(0) - 0x6f0);
      const normKey = (s) =>
        String(s == null ? "" : s)
          .replace(/\u0640/g, "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      function extractSheetId(input) {
        const s = String(input || "").trim(),
          m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        return m ? m[1] : s;
      }
      function sanitizeNumber(raw) {
        let d = normDigits(raw == null ? "" : raw).replace(/\D/g, "");
        if (!d) return "";
        if (d.indexOf("00") === 0) d = d.slice(2);
        if (d.length === 11 && d[0] === "0") d = "20" + d.slice(1);
        else if (d.length === 10 && /^[0125]/.test(d)) d = "20" + d;
        return d;
      }
      const isValidWa = (n) =>
        /^20\d{10}$/.test(n) || (/^\d{10,15}$/.test(n) && n[0] !== "0");
      function fixImage(u) {
        u = String(u || "").trim();
        const m = u.match(/drive\.google\.com\/file\/d\/([\w-]{10,})/);
        return m
          ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1000"
          : u;
      }

      /* ═══ قراءة Google Sheets (بوسم script عشان يشتغل محلي وعلى الاستضافة) ═══ */
      const gvizQueue = [];
      window.google = window.google || {};
      window.google.visualization = window.google.visualization || {
        Query: {},
      };
      window.google.visualization.Query.setResponse = (resp) => {
        const n = gvizQueue.shift();
        if (n) n(resp);
      };

      function loadGviz(sheetId, tab) {
        return new Promise((resolve, reject) => {
          let done = false;
          const entry = (r) => finish(resolve, r);
          const purge = () => {
            const i = gvizQueue.indexOf(entry);
            if (i > -1) gvizQueue.splice(i, 1);
          };
          const finish = (fn, a) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            fn(a);
          };
          const timer = setTimeout(() => {
            purge();
            finish(reject, new Error("timeout"));
          }, 15000);
          gvizQueue.push(entry);
          const s = document.createElement("script");
          s.onerror = () => {
            purge();
            finish(reject, new Error("net"));
          };
          s.onload = () => s.remove();
          s.src =
            "https://docs.google.com/spreadsheets/d/" +
            sheetId +
            "/gviz/tq?tqx=out:json&headers=1" +
            (tab ? "&sheet=" + encodeURIComponent(tab) : "") +
            "&_=" +
            Date.now();
          document.head.appendChild(s);
        });
      }
      async function fetchGviz(sheetId, tab) {
        const resp = await loadGviz(sheetId, tab);
        if (resp && resp.status === "error")
          throw new Error(resp.reason || "gviz-error");
        const t = resp && resp.table;
        if (!t) throw new Error("payload");
        return {
          headers: (t.cols || []).map((c) =>
            (c && c.label != null ? String(c.label) : "").trim(),
          ),
          rows: (t.rows || []).map((r) =>
            ((r && r.c) || []).map((c) =>
              c && c.v != null ? String(c.v) : "",
            ),
          ),
        };
      }

      const PRODUCT_KEYS = {
        image: ["الصورة", "صورة", "رابط الصورة", "image", "img"],
        name: ["الاسم", "اسم المنتج", "المنتج", "اسم", "name"],
        price: ["السعر", "سعر", "السعر بالجنيه", "price"],
        desc: ["الوصف", "وصف", "تفاصيل", "التفاصيل", "description"],
        cat: ["الفئة", "فئة", "التصنيف", "النوع", "category"],
        avail: ["متاح", "المتاح", "متوفر", "المتوفر", "available"],
      };
      const SETTINGS_KEYS = {
        whatsapp: [
          "رقم الواتساب",
          "رقم واتساب",
          "الواتساب",
          "واتساب",
          "رقم المحل",
          "رقم التليفون",
          "رقم الهاتف",
        ],
        shopName: ["اسم المحل", "اسم المتجر", "اسم الموقع"],
        tagline: ["نبذة", "نبذة المحل", "الوصف", "وصف المحل"],
        orderMsg: ["رسالة الطلب", "نص الطلب", "الرسالة"],
        currency: ["عملة", "العملة", "العمله"],
        cover: ["غلاف", "الغلاف", "صورة الغلاف", "رابط الغلاف"],
        logo: [
          "لوجو",
          "اللوجو",
          "شعار",
          "الشعار",
          "رابط اللوجو",
          "رابط الشعار",
        ],
      };
      function buildColIndex(headers, keys) {
        const idx = {};
        headers.forEach((h, i) => {
          const n = normKey(h);
          if (!n) return;
          for (const k in keys)
            if (keys[k].indexOf(n) !== -1 && idx[k] == null) idx[k] = i;
        });
        return idx;
      }
      function mapProducts(t) {
        if (!t || !t.headers || !t.headers.length)
          return {
            error: "الجدول رجّع بيانات فاضية — اتأكد إن رابط الجدول صح.",
          };
        const idx = buildColIndex(t.headers, PRODUCT_KEYS);
        if (idx.name == null)
          return {
            error:
              'عمود "الاسم" مش موجود في تبويب منتجات. رؤوس الأعمدة لازم تكون: الصورة، الاسم، السعر، الوصف، الفئة، متاح.',
          };
        const out = [];
        for (const row of t.rows) {
          const get = (k) =>
            idx[k] != null
              ? String(row[idx[k]] == null ? "" : row[idx[k]]).trim()
              : "";
          const name = get("name");
          if (!name) continue;
          const pr = normDigits(get("price")).replace(/[^\d.]/g, "");
          let available = true;
          if (
            idx.avail != null &&
            [
              "لا",
              "no",
              "false",
              "0",
              "غير متاح",
              "نفد",
              "خالص",
              "منتهي",
            ].indexOf(normDigits(get("avail")).trim().toLowerCase()) !== -1
          )
            available = false;
          out.push({
            image: fixImage(get("image")),
            name,
            price: pr === "" ? null : parseFloat(pr),
            desc: get("desc"),
            cat: get("cat"),
            available,
          });
        }
        return { products: out };
      }
      function mapSettings(t) {
        const out = {};
        if (!t) return out;
        for (const row of t.rows) {
          const key = normKey(row[0]),
            val = String(row[1] == null ? "" : row[1]).trim();
          if (!key || !val) continue;
          for (const k in SETTINGS_KEYS)
            if (SETTINGS_KEYS[k].indexOf(key) !== -1 && out[k] == null)
              out[k] = val;
        }
        return out;
      }

      /* ═══ واتساب ═══ */
      const currency = () =>
        (SETTINGS.currency || CONFIG.CURRENCY || "ج.م").trim();
      const fmt = (n) => Number(n).toLocaleString("en-US");
      const waLink = (t) =>
        "https://wa.me/" + WA + "?text=" + encodeURIComponent(t);
      function orderText(p) {
        return (SETTINGS.orderMsg || CONFIG.ORDER_MESSAGE)
          .replace(/\{المنتج\}/g, p.name)
          .replace(
            /\{السعر\}/g,
            p.price != null ? fmt(p.price) : "السعر عند الطلب",
          )
          .replace(/\{العملة\}/g, p.price != null ? currency() : "")
          .replace(/\{الفئة\}/g, p.cat || "")
          .replace(/[ \t]+/g, " ")
          .trim();
      }

      /* ═══ الرسم ═══ */
      function renderIdentity() {
        const name = (SETTINGS.shopName || CONFIG.SHOP_NAME || "متجري").trim();
        const tag = (SETTINGS.tagline || CONFIG.SHOP_TAGLINE || "").trim();
        $("brandName").textContent = name;
        $("brandTagline").textContent = tag;
        $("footerName").textContent = name;
        document.title = name + " — اطلب عبر واتساب";
        const L = $("heroLogo"),
          lu = fixImage(SETTINGS.logo || CONFIG.LOGO_IMAGE || "");
        if (L.dataset.src !== lu) {
          L.dataset.src = lu;
          L.innerHTML = WORDMARK;
          if (lu) {
            const im = new Image();
            im.onload = () => {
              if (L.dataset.src !== lu) return;
              im.alt = name;
              L.innerHTML = "";
              L.appendChild(im);
            };
            im.src = lu;
          }
        }
        const B = $("heroBg"),
          cu = fixImage(SETTINGS.cover || CONFIG.COVER_IMAGE || "");
        if (B.dataset.src !== cu) {
          B.dataset.src = cu;
          B.classList.remove("on");
          if (cu) {
            const im = new Image();
            im.onload = () => {
              if (B.dataset.src !== cu) return;
              B.style.backgroundImage =
                "url('" + cu.replace(/'/g, "%27") + "')";
              B.classList.add("on");
            };
            im.src = cu;
          }
        }
      }
      function renderChips() {
        const cats = [];
        PRODUCTS.forEach((p) => {
          const c = (p.cat || "").trim();
          if (c && cats.indexOf(c) === -1) cats.push(c);
        });
        $("chips").innerHTML = ["الكل"]
          .concat(cats)
          .map((c) => {
            const n =
              c === "الكل"
                ? PRODUCTS.length
                : PRODUCTS.filter((p) => p.cat === c).length;
            return (
              '<button class="chip' +
              (c === activeCat ? " on" : "") +
              '" type="button" data-cat="' +
              esc(c) +
              '">' +
              esc(c) +
              "<small>" +
              n +
              "</small></button>"
            );
          })
          .join("");
      }
      function orderBtn(p, cls) {
        if (!p.available)
          return (
            '<button class="' +
            cls +
            ' off" type="button" disabled>غير متاح حالياً</button>'
          );
        if (!WA)
          return (
            '<button class="' +
            cls +
            ' off" type="button" disabled>الطلب غير متاح حالياً</button>'
          );
        return (
          '<a class="' +
          cls +
          '" href="' +
          esc(waLink(orderText(p))) +
          '" target="_blank" rel="noopener"><svg><use href="#wa"/></svg>اطلب الآن</a>'
        );
      }
      function phHTML(p) {
        const h =
          Array.from(p.name).reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
        return (
          '<div class="ph" style="background:linear-gradient(135deg,hsl(' +
          h +
          " 55% 58%),hsl(" +
          ((h + 50) % 360) +
          ' 60% 36%))">' +
          esc(p.name.trim().charAt(0) || "؟") +
          "</div>"
        );
      }
      const imgHTML = (p) =>
        p.image
          ? '<img loading="lazy" src="' +
            esc(p.image) +
            '" alt="' +
            esc(p.name) +
            '" onload="this.classList.add(\'ok\')" onerror="this.remove()">'
          : "";
      const priceHTML = (p, cls) =>
        p.price != null
          ? '<div class="' +
            cls +
            '">' +
            fmt(p.price) +
            " <span>" +
            esc(currency()) +
            "</span></div>"
          : '<div class="' + cls + '"><span>السعر عند الطلب</span></div>';

      function cardHTML(p, i) {
        return (
          '<article class="card in" style="--i:' +
          Math.min(i, 14) +
          '" data-i="' +
          p._i +
          '"><div class="thumb">' +
          phHTML(p) +
          imgHTML(p) +
          (p.cat ? '<span class="tag">' + esc(p.cat) + "</span>" : "") +
          (!p.available ? '<div class="sold">نفدت الكمية</div>' : "") +
          '</div><div class="body"><h3 class="name">' +
          esc(p.name) +
          "</h3>" +
          (p.desc ? '<p class="desc">' + esc(p.desc) + "</p>" : "") +
          priceHTML(p, "price") +
          orderBtn(p, "order-btn") +
          "</div></article>"
        );
      }
      function renderGrid() {
        const q = query.trim().toLowerCase();
        const list = PRODUCTS.filter(
          (p) =>
            (activeCat === "الكل" || p.cat === activeCat) &&
            (!q ||
              (p.name + " " + p.desc + " " + p.cat).toLowerCase().indexOf(q) !==
                -1),
        );
        $("empty").classList.toggle("hidden", !!list.length);
        $("grid").classList.toggle("hidden", !list.length);
        $("grid").innerHTML = list.map(cardHTML).join("");
      }
      function renderSkeleton() {
        $("grid").innerHTML = Array(6)
          .fill('<div class="sk"><i></i><i></i><i></i></div>')
          .join("");
      }

      /* ═══ نافذة تفاصيل المنتج ═══ */
      function openModal(p) {
        $("sheet").innerHTML =
          '<div class="m-img">' +
          phHTML(p) +
          imgHTML(p) +
          '<button class="m-x" type="button" aria-label="إغلاق">×</button></div><div class="m-body">' +
          (p.cat ? '<span class="m-cat">' + esc(p.cat) + "</span>" : "") +
          "<h2>" +
          esc(p.name) +
          "</h2>" +
          priceHTML(p, "m-price") +
          (p.desc ? '<p class="m-desc">' + esc(p.desc) + "</p>" : "") +
          orderBtn(p, "m-order") +
          "</div>";
        $("modal").classList.add("open");
        $("modal").setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }
      function closeModal() {
        $("modal").classList.remove("open");
        $("modal").setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      /* ═══ التنبيهات ═══ */
      function banner(type, msg) {
        const b = document.createElement("div");
        b.className = "banner b-" + type;
        b.textContent = msg;
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "×";
        x.setAttribute("aria-label", "إغلاق");
        x.onclick = () => b.remove();
        b.appendChild(x);
        $("banners").appendChild(b);
      }

      /* ═══ التشغيل ═══ */
      function finalize() {
        PRODUCTS.forEach((p, i) => (p._i = i));
        const cleaned = sanitizeNumber(
          SETTINGS.whatsapp || CONFIG.WHATSAPP_NUMBER,
        );
        WA = isValidWa(cleaned) ? cleaned : "";
        renderIdentity();
        renderChips();
        renderGrid();
        const fab = $("fab"),
          cta = $("heroCta");
        if (WA) {
          fab.href = cta.href = waLink("مرحباً، عندي استفسار عن المنتجات");
          fab.classList.remove("off");
        } else {
          fab.classList.add("off");
          cta.classList.add("hidden");
          banner(
            "warn",
            'رقم الواتساب لسه مش متظبط — حط رقم محلك في تبويب "إعدادات" في الجدول (مثال: 201012345678) وبعدين اعمل Refresh.',
          );
        }
      }

      async function init() {
        renderIdentity();
        const id = extractSheetId(CONFIG.SHEET_ID);
        if (!id) {
          PRODUCTS = CONFIG.DEMO_PRODUCTS.slice();
          banner(
            "demo",
            "ده عرض تجريبي بمنتجات وهمية. اربط جدول Google Sheets علشان تظهر منتجاتك الحقيقية.",
          );
          return finalize();
        }
        renderSkeleton();
        let table = null,
          fallback = false;
        try {
          table = await fetchGviz(id, CONFIG.TAB_PRODUCTS);
        } catch (e) {
          try {
            table = await fetchGviz(id, "");
            fallback = true;
          } catch (e2) {
            table = null;
          }
        }

        if (table) {
          const m = mapProducts(table);
          if (m.error) {
            banner("error", m.error);
            PRODUCTS = CONFIG.DEMO_PRODUCTS.slice();
          } else {
            PRODUCTS = m.products;
            if (fallback && PRODUCTS.length)
              banner(
                "warn",
                'بنقرأ المنتجات من أول تبويب لأننا ملقيناش تبويب اسمه "منتجات". سمّي التبويب "منتجات" لتنظيم أفضل.',
              );
            if (!PRODUCTS.length)
              banner(
                "warn",
                'الجدول متوصّل، بس مفيش منتجات لسه — ضيف صفوف في تبويب "منتجات".',
              );
          }
        } else {
          banner(
            "error",
            'تعذّر الوصول لتبويب "منتجات". اتأكد من: (١) الجدول مشارك بـ "أي حد عنده الرابط — مُشاهد"، (٢) اسم التبويب "منتجات"، (٣) رابط الجدول صح.',
          );
          PRODUCTS = CONFIG.DEMO_PRODUCTS.slice();
        }
        try {
          SETTINGS = mapSettings(await fetchGviz(id, CONFIG.TAB_SETTINGS));
        } catch (e) {}
        finalize();
      }

      /* ═══ الأحداث ═══ */
      $("chips").addEventListener("click", (e) => {
        const c = e.target.closest(".chip");
        if (!c) return;
        activeCat = c.dataset.cat;
        document
          .querySelectorAll(".chip")
          .forEach((x) => x.classList.toggle("on", x === c));
        renderGrid();
      });
      let t;
      $("q").addEventListener("input", (e) => {
        clearTimeout(t);
        t = setTimeout(() => {
          query = e.target.value;
          renderGrid();
        }, 140);
      });
      $("reset").addEventListener("click", () => {
        $("q").value = "";
        query = "";
        activeCat = "الكل";
        renderChips();
        renderGrid();
      });
      $("grid").addEventListener("click", (e) => {
        if (e.target.closest(".order-btn")) return;
        const c = e.target.closest(".card");
        if (c) openModal(PRODUCTS[+c.dataset.i]);
      });
      $("modal").addEventListener("click", (e) => {
        if (e.target === $("modal") || e.target.closest(".m-x")) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
      $("fab").addEventListener("click", (e) => {
        if (!WA) e.preventDefault();
      });

      init();
    </script>
  </body>
</html>
